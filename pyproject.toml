[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "prod-agent-distillation"
version = "0.1.0"
description = "Progress-Aware Distillation (ProD) for mitigating stagnation in small language model agents (NeurIPS 2026)."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
# Versions below are the ones used for the paper's experiments.
dependencies = [
  # vendored smolagents (src/smolagents) runtime deps
  "huggingface-hub>=0.31.2",
  "requests>=2.32.3",
  "rich>=13.9.4",
  "jinja2>=3.1.4",
  "pillow>=10.0.1",
  "python-dotenv",
  "timeout-decorator",
  # agents / judging
  "litellm==1.77.7",
  "openai==2.2.0",
  "pydantic==2.12.0",
  # training
  "torch==2.8.0",
  "transformers==4.55.4",
  "peft==0.17.1",
  "trl==0.18.1",
  "accelerate==1.10.1",
  "datasets==4.1.1",
  "vllm==0.11.0",
  # stagnation scores
  "rouge-score==0.1.2",
  "numpy==2.2.6",
  "pyyaml",
  "tqdm",
]

[project.optional-dependencies]
semantic = ["sentence-transformers==5.3.0"]
wandb = ["wandb"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["smolagents*", "prod*"]

[tool.setuptools.package-data]
"smolagents.prompts" = ["*.yaml"]
